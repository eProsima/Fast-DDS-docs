<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="893px" height="443px" viewBox="0 0 893 443">
  <defs>
    <marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
    <style type="text/css">
      .ds-panel { fill: #FFFFFF; stroke: #E3E7EC; stroke-width: 2; }
      .ds-title { font-family: Helvetica, Arial, sans-serif; font-size: 23px; font-weight: bold; fill: #0B3B87; }
      .ds-node { fill: #EAF4FE; stroke: #2AA1E3; stroke-width: 2; }
      .ds-server { fill: #1A91D4; stroke: #1A91D4; stroke-width: 2; }
      .ds-label { font-family: Helvetica, Arial, sans-serif; font-size: 17px; fill: #1F2937; text-anchor: middle; }
      .ds-server-label { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .ds-arrow { stroke: #666666; stroke-width: 3; fill: none; marker-end: url(#ds-arrow); }
      .ds-arrow-both { stroke: #666666; stroke-width: 3; fill: none; marker-start: url(#ds-arrow); marker-end: url(#ds-arrow); }
    </style>
  </defs>

  <!-- ============ Discovery Server ============ -->
  <rect class="ds-panel" x="18" y="28" width="414" height="387" rx="16"/>
  <text class="ds-title" x="46" y="74">Discovery Server</text>

  <rect class="ds-node" x="42" y="98" width="118" height="42" rx="21"/>
  <text class="ds-label" x="101" y="125">client 1</text>

  <rect class="ds-node" x="268" y="98" width="118" height="42" rx="21"/>
  <text class="ds-label" x="327" y="125">client 3</text>

  <rect class="ds-node" x="42" y="318" width="118" height="42" rx="21"/>
  <text class="ds-label" x="101" y="345">client 2</text>

  <rect class="ds-node" x="268" y="318" width="118" height="42" rx="21"/>
  <text class="ds-label" x="327" y="345">client 4</text>

  <rect class="ds-server" x="148" y="205" width="150" height="44" rx="22"/>
  <text class="ds-server-label" x="223" y="233">Server(s)</text>

  <line class="ds-arrow" x1="126" y1="140" x2="181" y2="203"/>
  <line class="ds-arrow" x1="302" y1="140" x2="265" y2="203"/>
  <line class="ds-arrow" x1="126" y1="318" x2="181" y2="253"/>
  <line class="ds-arrow" x1="302" y1="318" x2="265" y2="253"/>

  <!-- ============ Simple Discovery ============ -->
  <rect class="ds-panel" x="452" y="28" width="422" height="387" rx="16"/>
  <text class="ds-title" x="480" y="74">Simple Discovery</text>

  <rect class="ds-node" x="478" y="116" width="136" height="46" rx="23"/>
  <text class="ds-label" x="546" y="145">participant 3</text>

  <rect class="ds-node" x="700" y="116" width="136" height="46" rx="23"/>
  <text class="ds-label" x="768" y="145">participant 1</text>

  <rect class="ds-node" x="478" y="296" width="136" height="46" rx="23"/>
  <text class="ds-label" x="546" y="325">participant 2</text>

  <rect class="ds-node" x="700" y="296" width="136" height="46" rx="23"/>
  <text class="ds-label" x="768" y="325">participant 4</text>

  <!-- participant 3 <-> participant 1 -->
  <line class="ds-arrow" x1="616" y1="131" x2="698" y2="131"/>
  <line class="ds-arrow" x1="698" y1="149" x2="616" y2="149"/>

  <!-- participant 2 <-> participant 4 -->
  <line class="ds-arrow" x1="616" y1="311" x2="698" y2="311"/>
  <line class="ds-arrow" x1="698" y1="329" x2="616" y2="329"/>

  <!-- participant 3 <-> participant 2 -->
  <line class="ds-arrow" x1="522" y1="294" x2="522" y2="164"/>
  <line class="ds-arrow" x1="542" y1="164" x2="542" y2="294"/>

  <!-- participant 1 <-> participant 4 -->
  <line class="ds-arrow" x1="752" y1="164" x2="752" y2="294"/>
  <line class="ds-arrow" x1="792" y1="294" x2="792" y2="164"/>

  <!-- diagonals -->
  <line class="ds-arrow-both" x1="602" y1="167" x2="712" y2="291"/>
  <line class="ds-arrow-both" x1="602" y1="291" x2="712" y2="167"/>
</svg>
