# Read the Docs configuration for the prebuilt Fast DDS documentation.
# This branch is generated automatically. Do not edit it by hand.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html $READTHEDOCS_OUTPUT/htmlzip
    - cp -r html/. $READTHEDOCS_OUTPUT/html/
    - cd $READTHEDOCS_OUTPUT && python -m zipfile -c htmlzip/fast-dds-docs.zip html
